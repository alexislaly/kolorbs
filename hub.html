<script>
// HEXAGONE FROM 7 TRIANGLES

// Parameters
const sideLength = 49; // Longueur d'un côté de l'heptagone
const N = 7; // Nombre de côtés
const H = 14

const centralAngle = 360 / N; // Angle au centre
const angleRad = centralAngle * Math.PI / 180; // Conversion degrés -> radians
const radius = sideLength / (2 * Math.sin(Math.PI / N)); // Rayon circonscrit
const heptagone = document.querySelector('#heptagone'); // Récup hexagone 

// CRÉATION DES TRIANGLES
// ============================================================
CylinderYrotation = [0, 128.571429, 77.142858, 25.714286, -25.714286, -77.142858, -128.571429]
WallYrotation = [-25.714286, -77.142858, -128.571429, 0, 128.571429, 77.142858, 25.714286]

// Creation du code couleur
K= ['00','00', '2B', '55', '80', 'AA', 'D5', 'FF']
function KL(r, g, b) { return `#${K[r]}${K[g]}${K[b]}`;}

//
const Ncolors = ['#FF0000', '#FF8000', '#FFFF00','#00FF00', '#00AAFF','#2B0055', '#802BD5'];
const NDarkcolors = [
    '#550000', // Rouge très sombre
    '#552B00', // Orange très sombre
    '#555500', // Jaune sombre
    '#005500', // Vert sombre
    '#005580', // Bleu cyan sombre
    '#00002B', // Violet très sombre
    '#2B002B'  // Violet sombre
];



for (let i = 0; i < N; i++) {
    // Angles des deux sommets
    const angle1 =  -Math.PI / 2 + i * angleRad;
    const angle2 =  -Math.PI / 2 + (i + 1) * angleRad;

    // Coordonnées des sommets
    const x1 = radius * Math.cos(angle1);
    const z1 = radius * Math.sin(angle1);
    const x2 = radius * Math.cos(angle2);
    const z2 = radius * Math.sin(angle2);

    // Création du triangle
    const triangle = document.createElement('a-entity');
    triangle.setAttribute('id', `triangle_${i + 1}`);
    triangle.setAttribute('geometry', { primitive: 'triangle',
        vertexA: `${x1} 0 ${z1}`,
        vertexB: `0 0 0`,
        vertexC: `${x2} 0 ${z2}`
    });

    // Matériau
    triangle.setAttribute('material', { color: '#000000', side: 'double', opacity: 1 , shader: 'flat'});
    
    heptagone.appendChild(triangle);
    
    const A = new THREE.Vector3(x1, 0, z1);
    const B = new THREE.Vector3(0, 0, 0);
    const C = new THREE.Vector3(x2, 0, z2);
    const direction = new THREE.Vector3().subVectors(B, A);
    const length = direction.length();
    const midpointAB = new THREE.Vector3().addVectors(A, B).multiplyScalar(0.5); // entre mur et centre
    const midpointAC = new THREE.Vector3().addVectors(A, C).multiplyScalar(0.5); // centre du mur
    const leftDoorPos = new THREE.Vector3().addVectors(A, new THREE.Vector3().subVectors(C, A).multiplyScalar(2/7)); // A +  (C-A*(2/7))
    const rightDoorPos = new THREE.Vector3().addVectors(A, new THREE.Vector3().subVectors(C, A).multiplyScalar(5/7)); // A +  (C-A*(5/7)) 
    
    const leftHDPos = new THREE.Vector3().addVectors(A, new THREE.Vector3().subVectors(C, A).multiplyScalar(2/7)).multiplyScalar(0.992);
    
    // Création du cylindre au sol
    const cylinder = document.createElement('a-cylinder');
      cylinder.setAttribute('id', `cylinder_${i + 1}`);
      cylinder.setAttribute('radius', 0.07);
      cylinder.setAttribute('height', length);
      cylinder.setAttribute('position',`${midpointAB.x} ${midpointAB.y} ${midpointAB.z}`);
      cylinder.setAttribute('material', `color: ${KL(7,7,7)}`);
      cylinder.setAttribute('rotation', `90  ${CylinderYrotation[i]}  0`);
    triangle.appendChild(cylinder);
    
    // Création du cylindre vertical
    const cylinderV = document.createElement('a-cylinder');
      cylinderV.setAttribute('id', `cylinderV_${i + 1}`); 
      cylinderV.setAttribute('radius', 0.07);
      cylinderV.setAttribute('height', H);
      cylinderV.setAttribute('position',`${A.x *0.9978} ${A.y +H/2} ${A.z*0.9978}`); // 
      cylinderV.setAttribute('material', `color: ${KL(7,7,7)}`);
      cylinderV.setAttribute('rotation', `0 0 0`);
    triangle.appendChild(cylinderV);
    
    // Création du cylindre au plafond
    const cylinderC = document.createElement('a-cylinder');
      cylinderC.setAttribute('id', `cylinderC_${i + 1}`);
      cylinderC.setAttribute('radius', 0.07);
      cylinderC.setAttribute('height', length);
      cylinderC.setAttribute('position',`${midpointAB.x} ${midpointAB.y +H} ${midpointAB.z}`);
      cylinderC.setAttribute('material', `color: ${KL(7,7,7)}`);
      cylinderC.setAttribute('rotation', `90  ${CylinderYrotation[i]}  0`);
    triangle.appendChild(cylinderC);
    
    // Création du cylindre au mileu des portes (M Middle)
    const cylinderM = document.createElement('a-cylinder');
      cylinderM.setAttribute('id', `cylinderM_${i + 1}`); 
      cylinderM.setAttribute('radius', 0.07);
      cylinderM.setAttribute('height', sideLength);
      cylinderM.setAttribute('position',`${midpointAC.x *0.9978} ${midpointAC.y +(H/2)} ${midpointAC.z*0.9978}`); // 
      cylinderM.setAttribute('material', `emissive: ${KL(1,7,1)}; ` + `emissiveIntensity: 0.5`);
      //cylinderM.setAttribute('material', `color: ${KL(1,7,1)}`);
      cylinderM.setAttribute('rotation', `0 ${WallYrotation[i]} 90`);
      cylinderM.setAttribute('opacity', `0.35`);
    triangle.appendChild(cylinderM);
    
    // Création du cylindre au pied des portes (D Down)
    const cylinderD = document.createElement('a-cylinder');
      cylinderD.setAttribute('id', `cylinderD_${i + 1}`); 
      cylinderD.setAttribute('radius', 0.07);
      cylinderD.setAttribute('height', sideLength);
      cylinderD.setAttribute('position',`${midpointAC.x *0.9978} ${midpointAC.y} ${midpointAC.z*0.9978}`); // 
      cylinderD.setAttribute('material', `emissive: ${KL(7,1,1)}; ` + `emissiveIntensity: 2`);
      cylinderD.setAttribute('rotation', `0 ${WallYrotation[i]} 90`);
      cylinderD.setAttribute('opacity', `0.35`);  
    triangle.appendChild(cylinderD);
    
    // Création du cylindre en haut des portes (T Top)
    const cylinderT = document.createElement('a-cylinder');
      cylinderT.setAttribute('id', `cylinderT_${i + 1}`); 
      cylinderT.setAttribute('radius', 0.07);
      cylinderT.setAttribute('height', sideLength);
      cylinderT.setAttribute('position',`${midpointAC.x *0.9978} ${midpointAC.y+H} ${midpointAC.z*0.9978}`); // 
      cylinderT.setAttribute('material', `emissive: ${KL(1,1,7)}; ` + `emissiveIntensity: 2`);
      //cylinderT.setAttribute('material', `color: ${KL(1,1,7)}`);
      cylinderT.setAttribute('rotation', `0 ${WallYrotation[i]} 90`);
      cylinderT.setAttribute('opacity', `0.35`);
    triangle.appendChild(cylinderT);
    
    // Création des murs
    const wall = document.createElement('a-box');
      wall.setAttribute('height', H );
      wall.setAttribute('depth', 0.14 );
      wall.setAttribute('width',  sideLength);
      wall.setAttribute('id', `wall_${i + 1}`);
      wall.setAttribute('position',`${midpointAC.x} ${midpointAC.y +H/2} ${midpointAC.z}`);
      wall.setAttribute('material', `color: ${KL(1,1,1)};` + `shader: flat`);
      wall.setAttribute('rotation', `0  ${WallYrotation[i]}  0`);
    triangle.appendChild(wall);
    
    // Création des portes de zones gauche
    const door1 = document.createElement('a-box');
      door1.setAttribute('height', H*0.49 );
      door1.setAttribute('depth', 0.49 );
      door1.setAttribute('class','clickable');
      door1.setAttribute('width',  sideLength/7);
      door1.setAttribute('id', `door1_${i + 1}`);
      door1.setAttribute('position',`${leftDoorPos.x} ${leftDoorPos.y +H*0.245} ${leftDoorPos.z}`);
      door1.setAttribute('material', `color: ${KL(1,1,1)};` + `shader: flat`);
      door1.setAttribute('rotation', `0  ${WallYrotation[i]}  0`);
    triangle.appendChild(door1);
    
    const hd_left = document.createElement('a-plane');
      hd_left.setAttribute('id', `hd0_${i + 1}`);
      hd_left.setAttribute('material', `src: #hd0_img`);
      hd_left.setAttribute('material', `alphaTest: 0.01`);
      hd_left.setAttribute('material', `shader: flat`); 
      hd_left.setAttribute('position',`${leftHDPos.x} ${leftHDPos.y +H*0.245} ${leftHDPos.z}`);
      hd_left.setAttribute('scale',`3 3 1`);
      hd_left.setAttribute('rotation', `0  ${WallYrotation[i]}  0`);
      
      hd_left.setAttribute('visible', `false`);
    triangle.appendChild(hd_left); //leftHDPos
         
    
    
    // Création des portes de zones droite
    const door2 = document.createElement('a-box');
      door2.setAttribute('height', H*0.49 );
      door2.setAttribute('depth', 0.49 );
      door2.setAttribute('width',  sideLength/7);
      door2.setAttribute('id', `door2_${i + 1}`);
      door2.setAttribute('position',`${rightDoorPos.x} ${rightDoorPos.y +H*0.245} ${rightDoorPos.z}`);
      door2.setAttribute('material', `color: ${KL(1,1,1)};` + `shader: flat`);
      door2.setAttribute('rotation', `0  ${WallYrotation[i]}  0`);
    triangle.appendChild(door2);
    
    // Création des zones indices
    const clue = document.createElement('a-box');
      clue.setAttribute('height', H*0.35 );
      clue.setAttribute('depth', 0.49 );
      clue.setAttribute('width',  sideLength*6/7);
      clue.setAttribute('id', `clue_${i + 1}`);
      clue.setAttribute('position',`${midpointAC.x} ${midpointAC.y +H*5/7} ${midpointAC.z}`);
      clue.setAttribute('material', `color: ${KL(2,2,2)}`);
      clue.setAttribute('rotation', `0  ${WallYrotation[i]}  0`);
    triangle.appendChild(clue); 
}
</script>

<!-- Configuration of ceiling flashlights -->
<!-- Enable the gltf models to have a color using the configureFlashlight function in scene.js -->
<script>
function configureFlashlight( flashlight, couleur) {
    flashlight.addEventListener(
        'model-loaded',
        () => {
            flashlight.object3D.traverse(
                (object) => {
                    if (!object.isMesh) {
                        return;
                    }
                  
                    const materials =
                        Array.isArray(object.material)
                            ? object.material
                            : [object.material];

                    materials.forEach(
                        (material) => {
                            if (!material) {
                                return;
                            }
                            // Couleur
                            if (material.color) {
                                material.color.set(couleur);
                            }
                            // Émission
                            if (material.emissive) {
                                material.emissive.set(couleur);
                                material.emissiveIntensity =
                                    2;
                            }
                            material.needsUpdate = true;
                        }
                    );

                    // CONTOURS NOIRS
                    if (!object.geometry) {
                        return;
                    }
                    const edges =
                        new THREE.EdgesGeometry(
                            object.geometry,
                            60
                        );

                    const lineMaterial =
                        new THREE.LineBasicMaterial({
                            color: 0x000000
                        });

                    const line =
                        new THREE.LineSegments(
                            edges,
                            lineMaterial
                        );

                    // Même transformation que le mesh
                    line.position.copy(
                        object.position
                    );

                    line.rotation.copy(
                        object.rotation
                    );

                    line.scale.copy(
                        object.scale
                    );


                    object.parent.add(line);

                }
            );

        }
    );
}
        configureFlashlight(flashlightL, '#ffffff');
        configureFlashlight(flashlightA, '#ffffff');
        configureFlashlight(flashlightB, '#ffffff');
    </script>

    <script>
    const rotate = document.querySelector('#rotate');

    let dragging = false;

    document.addEventListener('mousedown', function(event) {

        // Clic gauche
        if (event.button === 0) {
            dragging = true;
        }

    });

    document.addEventListener('mousemove', function(event) {

        if (dragging) {

            rotate.style.opacity = '0';

            setTimeout(function() {
                rotate.style.display = 'none';
            }, 3000);

            dragging = false;
        }

    });

    document.addEventListener('mouseup', function(event) {

        if (event.button === 0) {
            dragging = false;
        }

    });
</script>
