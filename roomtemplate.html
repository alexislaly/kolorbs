<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>111 - Red</title>
    <meta name="author" content="Alexis Laly">
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-event-set-component@3.0.3/dist/aframe-event-set-component.min.js"> // interaction </script>
    <script src="https://cdn.jsdelivr.net/npm/nipplejs@0.10.2/dist/nipplejs.min.js"> // smartphone </script>

    <!-- Configuration -->
    
    <script> 
        const CONFIG = {
          
            // LEVEL
            level: 'Level 1-1-1',
            levelName: 'Red',
            debug: false, // diplay debug? 

            // COULEURS
            couleurNeon: '#ff0000',
            couleurGrille: '#ff0000',
            couleurButton: '#ff0000',
            couleurFlashlightA: '#ffffff',
            couleurLumiereFlashlightA: '#ffffff',
            couleurFlashlightB: '#ffffff',
            couleurLumiereFlashlightB: '#ffffff',

            // INTENSITÉS
            intensiteNeon: 2,
            intensiteEmissionFlashlight: 2,
            intensiteLumiereFlashlight: 2,

            // CONDITIONS DE RÉUSSITE
            // ----------------------         
            win_sphereInDockColor: '#ff0000',
            win_TargetColor: '#ff0000', 
            win_TargetLightColor: '#ffffff',    
            win_TargetLightVisible: true,
            win_DockLightColor: '#ffffff',      
            win_DockLightVisible: true,
        };
    </script>

    <style>
        #textOnScreen {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: #ffffff;
            font-family: Arial;
            font-size: 15px;
            line-height: 1.5;
            text-align: center;
            background: rgba(0, 0, 0, 0.75);
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            z-index: 9999;
            min-width: 300px;
        }
        #levelWinMessageScreen {
            display: none;
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff00;
            font-family: Arial;
            font-size: 50px;
            font-weight: bold;
            text-align: center;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px 50px;
            border: 3px solid #00ff00;
            border-radius: 20px;
            z-index: 10000;
        }
    </style>
  </head>
  
  <body>
    <a-scene id='scene'>
  
        <!-- ÉLÉMENTS SPÉCIFIQUES AU NIVEAU -->
      
        <!-- Si le niveau debute avec une sphere en main, l'ajouter plus bas en js -->
        <!-- Si le niveau debute avec une sphere dans le dock, l'ajouter plus bas en js -->
        <!-- Dans les deux cas les spheres doivent etre enfants de la cam ou du dock -->
        
        
        <!-- Ceiling Lights -->
        <a-entity id="FlashLightEntityL"
                  position="-5 4.7 -5" rotation="-90 0 0">
            <a-gltf-model id="flashlightL"
                          class="clickable" src="#flashlight_model" scale="60 60 60"
                          rotation="-90 0 0" color="#ffffff" material="shader: flat"
                          switch="lightFromFlashLightL coneL">
            </a-gltf-model>
            <a-light id="lightFromFlashLightL"
                     type="spot" color="#ffffff" intensity="10" distance="15"
                     angle="30" penumbra="0.2" decay="1" visible="false">
            </a-light>
            <a-cone id="coneL"
                    material="opacity: 0.035; shader: flat; side: double; transparent: true; depthWrite: false"
                    rotation="90 0 0" position="0 0 -2.85337" scale="2.5 4.9 2.5" visible="false">
            </a-cone>
        </a-entity>
        <a-entity id="FlashLightEntityR"
                  position="5 4.7 -5"
                  rotation="-90 0 0">
            <a-gltf-model id="flashlightR"
                          class="clickable" src="#flashlight_model" scale="60 60 60" rotation="-90 0 0"
                          color="#ffffff" material="shader: flat" switch="lightFromFlashLightR coneR">
            </a-gltf-model>
            <a-light id="lightFromFlashLightR"
                     type="spot" color="#ffffff" intensity="10"
                     distance="15" angle="30" penumbra="0.2" decay="1">
            </a-light>
            <a-cone id="coneR"
                    material="   opacity: 0.035; shader: flat; side: double; transparent: true; depthWrite: false"
                    rotation="90 0 0" position="0 0 -2.85337" scale="2.5 4.9 2.5">
            </a-cone>
        </a-entity>
        <a-entity id="FlashLightEntityC"
                  position="0 4.7 0" rotation="-90 0 0">
            <a-gltf-model id="flashlightC"
                          class="clickable" src="#flashlight_model" scale="60 60 60" rotation="-90 0 0" 
                          color="#ffffff" material="shader: flat" switch="lightFromFlashLightC coneC">
            </a-gltf-model>
            <a-light id="lightFromFlashLightC"
                     type="spot" color="#ffffff" intensity="10"
                      distance="15" angle="30" penumbra="0.2" decay="1">
            </a-light>
            <a-cone id="coneC"
                    material="opacity: 0.035; shader: flat; side: double; transparent: true; depthWrite: false "
                    rotation="90 0 0" position="0 0 -2.85337" scale="2.5 4.9 2.5">
            </a-cone>
        </a-entity>

        <!-- Red sphere on the left -->
        <a-sphere id="redSphere_grab"
            radius="0.20" position="-5 0.2 -5" color="#ff0000" class="clickable">
        </a-sphere>

        <!-- Second black dock on the right -->
        <a-torus id="torusR_socket_empty"
                 position="5 0.077 -5"  rotation="-90 0 0" class="clickable" color="#ffffff" geometry="radius: 0.28; radiusTubular: 0.07" 
        ></a-torus>
        
        <!-- First person white sphere -->
        <!-- created later in js -->
    </a-scene>
    
    
    <!-- JS SCRIPTS -->
    <!-- ========== -->

    <!-- Creation of the base room form confiuration parameters -->
    <script src="js/template.js"></script>
    
    <!-- Creation of the first person sphere when level begins  -->
    <script>
      const sphere = document.createElement('a-sphere');
      sphere.setAttribute('id', 'whiteSphere_grab_cam');
      sphere.setAttribute('radius', '0.1');
      sphere.setAttribute('position', '0.14 -0.185 -0.35');
      sphere.setAttribute('color', '#ffffff');
      sphere.setAttribute('visible', 'true');
      sphere.setAttribute('class', 'clickable');
      
      document.querySelector('#cam').appendChild(sphere);
    </script>
    
    <!-- Creation of the spheres in a dock when level begins  -->
    <script>
      const sphere = document.createElement('a-sphere');
      sphere.setAttribute('id', 'whiteSphere_grab_cam');
      sphere.setAttribute('radius', '0.1');
      sphere.setAttribute('position', '0.14 -0.185 -0.35');
      sphere.setAttribute('color', '#ffffff');
      sphere.setAttribute('visible', 'true');
      sphere.setAttribute('class', 'clickable');
      
     // document.querySelector('#dockid').appendChild(sphere);
    </script>
  
    <!-- Configuration of ceiling flashlights -->
    <!-- Enable the gltf models to have a color using the configureFlashlight function in scene.js -->
    <script>
        configureFlashlight(flashlightL, '#ffffff');
        configureFlashlight(flashlightR, '#ffffff');
        configureFlashlight(flashlightC, '#ffffff');
    </script>

    <!-- Victory message -->
    <div id="levelWinMessageScreen">
         Level cleared!
    </div>
    <!-- Level name and debug text on screen -->
    <div id="textOnScreen">
        <span id="level"></span>
        <br>
        <span id="levelName"></span>
    
        <!-- Debug uniquement, appear if debug = true (l:19) -->
        <div id="debugInfo">
            <hr>
            <div>
                Sphere in Dock:
                <span id="debugSphereColor">---</span>
            </div>
            <div>
                Target:
                <span id="debugTargetColor">---</span>
            </div>
            <div>
                Target Light:
                <span id="debugTargetLightColor">---</span>
            </div>
            <div>
                Dock Light:
                <span id="debugDockLightColor">---</span>
            </div>
        </div>
    </div>
    <!-- Level name on screen -->
    <script>
        document.getElementById('level').textContent =
            CONFIG.level;
        document.getElementById('levelName').textContent =
            CONFIG.levelName;
        document.getElementById('debugInfo').style.display =
            CONFIG.debug ? 'block' : 'none';

    </script>


    <!-- Win test -->
    <!-- From win conditions in configuration -->
    <script>

        function checkLevelWin() {

          // Get the current colors                           
            
            // Sphere in the dock, color?
            const dock = document.querySelector('[id*="dock"]');
            const sphereInDock = dock?.firstElementChild;
        
            const test_sphereInDockColor = sphereInDock?.getAttribute('color') ?? '---';
                
            // Target, color?
            const target =  document.querySelector('#button');
            const test_TargetColor = target.getAttribute('color');
            
            // Target Light, color and visible?
            const targetLight = document.querySelector('#flashlightLightA');
            const test_TargetLightColor = targetLight.getAttribute('color');
            const test_TargetLightVisible = targetLight.getAttribute('visible');
            
            // Dock Light, color and visible?
            const dockLight = document.querySelector('#flashlightLightB');
            const test_DockLightColor = dockLight.getAttribute('color');
            const test_DockLightVisible = dockLight.getAttribute('visible');

         // Debug
            document.querySelector('#debugSphereColor').textContent =
                test_sphereInDockColor;
            document.querySelector('#debugTargetColor').textContent =
                test_TargetColor;
            document.querySelector('#debugTargetLightColor').textContent =
                test_TargetLightColor;
            document.querySelector('#debugDockLightColor').textContent =
                test_DockLightColor;

         // Win test
            if (
                   test_sphereInDockColor === CONFIG.win_sphereInDockColor
                && test_TargetColor === CONFIG.win_TargetColor
                && test_TargetLightColor === CONFIG.win_TargetLightColor
                && test_DockLightColor === CONFIG.win_DockLightColor
                && test_DockLightVisible === CONFIG.win_DockLightVisible
                && test_TargetLightVisible === CONFIG.win_TargetLightVisible
                
               ) {

                // Évite de recréer le message plusieurs fois
                const winMessage =
                    document.querySelector(
                        '#levelWinMessageScreen'
                    );
                if (winMessage.style.display !== 'block') {
                    winMessage.style.display = 'block';
                   }
                return true;
                }
             return false;
             }

        // CHeck victory every 100ms
        setInterval(checkLevelWin, 100);
    </script>
    
           
    <!-- Grab and socket function -->
    <!-- Enable the objects to be grabbed, swapped an placed in sockets-->
    <script src= 'js/grab_and_socket.js'></script>
    
    <!-- Smartphone? -->


  </body>
</html>
